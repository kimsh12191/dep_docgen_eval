<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>통장사본</title>
<style>
:root {
  --font: &#39;NanumBarunGothic&#39;, &#39;Malgun Gothic&#39;, &#39;Nanum Gothic&#39;, &#39;Noto Sans CJK KR&#39;, &#39;Gulim&#39;, &#39;Dotum&#39;, sans-serif;
  --fs: 12.7px;
  --title: 27px;
  --lh: 1.48;
  --border: #333;
  --bw: 1px;
  --label-bg: #f5f5f0;
  --accent: #0b5394;
  --pad: 5px;
  --page-pad: 64px;
  --paper: #ffffff;
  --seal: #e0312b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.page {
  position: relative; overflow: hidden; background: var(--paper); color: #111;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  width: 794px; height: 1123px; padding: var(--page-pad);
}
.page.a4_landscape { width: 1123px; height: 794px; }
.page.card { width: 540px; height: 340px; padding: 20px 24px; border-radius: 18px; }
.page.passport { width: 720px; height: 500px; padding: 22px 28px; }
.page.a4.dense { font-size: calc(var(--fs) - 1.5px); line-height: 1.35; }

h1.title { text-align: center; font-size: var(--title); letter-spacing: .25em; margin: 6px 0 22px; font-weight: 700; }
h1.title.box { border: 2px solid var(--border); padding: 8px; }
h1.title .sub { display: block; font-size: 13px; letter-spacing: .05em; font-weight: 400; color: #444; margin-top: 4px; }
h2.sec { font-size: calc(var(--fs) + 2px); margin: 16px 0 6px; padding-left: 8px; border-left: 4px solid var(--accent); }
h3.sec { font-size: calc(var(--fs) + 1px); margin: 12px 0 4px; }

table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th, td { border: var(--bw) solid var(--border); padding: var(--pad) calc(var(--pad) + 3px); vertical-align: middle; }
th { background: var(--label-bg); font-weight: 600; text-align: center; white-space: nowrap; }
td.num, .num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, .c { text-align: center; }
table.plain th, table.plain td { border: 0; padding: 2px 4px; background: none; text-align: left; }
table.outer { border: 2px solid var(--border); }
table.compact th, table.compact td { padding: 3px 5px; font-size: calc(var(--fs) - 1px); }

.row { display: flex; gap: 12px; align-items: flex-start; }
.between { display: flex; justify-content: space-between; align-items: flex-end; }
.right { text-align: right; } .center { text-align: center; } .bold { font-weight: 700; }
.small { font-size: calc(var(--fs) - 2px); } .tiny { font-size: calc(var(--fs) - 3.5px); }
.muted { color: #555; } .accent { color: var(--accent); }
.box { border: var(--bw) solid var(--border); padding: 10px 12px; margin: 8px 0; }
.note { font-size: calc(var(--fs) - 2px); color: #333; margin: 6px 0; }
.note li { margin: 2px 0; }
.mt { margin-top: 18px; } .mb { margin-bottom: 18px; } .mt-l { margin-top: 36px; }
.spacer { flex: 1; }
.u { border-bottom: 1px solid #333; padding: 0 6px; }
ol.clauses { padding-left: 1.4em; margin: 6px 0; }
ol.clauses li { margin: 3px 0; }

.issuer { text-align: center; margin-top: 28px; }
.issuer .date { margin-bottom: 18px; letter-spacing: .05em; }
.issuer .org { font-size: calc(var(--fs) + 8px); font-weight: 700; letter-spacing: .2em; position: relative; display: inline-block; padding-right: 18px; }
.seal {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  width: 64px; height: 64px; border: 3px solid var(--seal); color: var(--seal);
  border-radius: 50%; font-size: 13px; line-height: 1.1; font-weight: 700;
  transform: rotate(-7deg); opacity: .82; vertical-align: middle; letter-spacing: 0;
  font-family: 'Nanum Myeongjo', 'Noto Serif CJK KR', serif; word-break: keep-all;
}
.seal.square { border-radius: 4px; }
.seal.img { border: none; } .seal.img img { width: 100%; height: 100%; object-fit: contain; }
.seal.sm { width: 40px; height: 40px; font-size: 10px; border-width: 2px; }
.seal.lg { width: 84px; height: 84px; font-size: 15px; }
.seal.over { position: absolute; right: -40px; top: -18px; }
.signline { display: inline-block; min-width: 120px; }
.inmark { position: relative; display: inline-block; min-width: 34px; text-align: center; }
.inmark .seal.onmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); margin: 0; }
.inmark .scribble { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); pointer-events: none; }
.corr { white-space: normal; }
.corr-old, .corr .fv { white-space: nowrap; }
.corr-old { text-decoration: line-through double; text-decoration-color: #c00; color: inherit; }
.seal.corr-seal { width: 22px; height: 22px; font-size: 7px; border-width: 1.5px; margin-left: 2px; vertical-align: -4px; }
.seal-missing { display: inline-block; width: 64px; height: 64px; vertical-align: middle; }
.seal-missing.sm { width: 40px; height: 40px; } .seal-missing.lg { width: 84px; height: 84px; }
.pg-keep { break-inside: avoid; }
.scribble svg { display: block; overflow: visible; }
.chk { white-space: nowrap; margin-right: 10px; }
.photo {
  background: linear-gradient(#e8e8e8, #d0d0d0); border: 1px solid #aaa; position: relative; overflow: hidden;
}
.photo::after {
  content: ""; position: absolute; left: 50%; top: 22%; width: 42%; height: 36%; transform: translateX(-50%);
  background: #b8b8b8; border-radius: 50%; box-shadow: 0 60px 0 30px #b8b8b8;
}
.sample-mark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-24deg);
  font-size: 64px; font-weight: 900; color: rgba(220, 20, 20, .16); letter-spacing: .2em;
  white-space: nowrap; pointer-events: none; font-family: sans-serif; z-index: 10;
}
.page.card .sample-mark { font-size: 44px; }
.docno { font-size: calc(var(--fs) - 2px); color: #333; }
.gov-head { display: flex; justify-content: space-between; font-size: calc(var(--fs) - 2px); color: #333; margin-bottom: 6px; }
.pb { display: flex; margin: 10px auto 0; width: 100%; height: 450px; border: 1px solid #9aa3ad; border-radius: 6px;
      background: linear-gradient(180deg, #f4f6f2 0%, #eef1ec 100%); box-shadow: 2px 3px 0 #c8c8c8; position: relative; }
.pb::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed #a9b0b6; }
.pb-l, .pb-r { flex: 1; padding: 18px 20px; position: relative; overflow: hidden; }
.pb-l::before { content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 6px, transparent 6px 12px); }
.pb-bank { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: .08em; }
.pb-prod { font-size: 15px; font-weight: 700; margin: 4px 0 12px; }
.pb-notice { font-size: 10.5px; line-height: 1.55; color: #333; }
.pb-seal { position: absolute; left: 20px; bottom: 20px; width: 150px; height: 120px; border: 1px solid #555;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px; background: #fff; }
.pb-seal .h { font-size: 11px; border-bottom: 1px solid #555; width: 100%; text-align: center; }
.pb-r table.plain td { padding: 4px 4px; font-size: 13px; }
.pb-r table.plain td:first-child { color: #444; width: 72px; white-space: nowrap; }
.pb-acct { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
table.pbt { font-size: 10px; margin-top: 12px; }
table.pbt th, table.pbt td { border: 0; border-bottom: 1px solid #b9c0c6; padding: 3px 2px; background: none; font-weight: 500; }
table.pbt th { color: #555; border-bottom: 1px solid #555; }
.closed-stamp { position: absolute; right: 44px; top: 300px; border: 3px solid var(--seal); color: var(--seal); padding: 4px 16px;
      text-align: center; transform: rotate(-12deg); opacity: .85; font-weight: 800; border-radius: 4px; background: rgba(255,255,255,.15); }
.closed-stamp .t { font-size: 30px; letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
.closed-stamp .d { font-size: 11px; font-weight: 700; }
.copy-note { margin-top: 18px; font-size: 13px; color: #444; }
.pr-head { border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: 18px; }
.pr-bank { font-weight: 800; color: var(--accent); font-size: 18px; letter-spacing: .05em; }
.pr-cover { border: 1px solid #9aa3ad; border-radius: 8px; padding: 26px 34px; background: linear-gradient(180deg, #f7f8f5, #eef1ec);
      box-shadow: 2px 3px 0 #d0d0d0; }
.pr-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #b9c0c6; padding-bottom: 8px; margin-bottom: 8px; }
.pr-tag { border: 1px solid var(--accent); color: var(--accent); padding: 2px 10px; font-size: 13px; border-radius: 3px; }
.pr-t td { padding: 7px 6px !important; font-size: 15px; }
.pr-t td:first-child { color: #444; width: 110px; }
</style>
</head>
<body>
<div class="page a4">
<div class="pb">
  <div class="pb-l">
    <div class="pb-bank"><span class="fv" data-field="bank" data-label="은행명" data-type="text"></span></div>
    <div class="pb-prod"><span class="fv" data-field="product" data-label="상품명" data-type="text"></span></div>
    <div class="pb-notice">
      · 이 통장은 예금자보호법에 따라 예금보험공사가 보호하되, 보호한도는 본 은행에 있는 귀하의 모든 예금보호대상 금융상품의 원금과 소정의 이자를 합하여 1인당 "최고 1억원"이며, 1억원을 초과하는 나머지 금액은 보호하지 않습니다.<br>
      · 통장과 도장(서명)은 분리하여 보관하시고, 분실하신 경우 즉시 거래점에 신고하여 주십시오.<br>
      · 통장을 타인에게 양도·대여하는 행위는 관련 법률에 따라 처벌받을 수 있습니다.
    </div>
    <div class="pb-seal"><div class="h">신고인감(서명)</div><span data-field="seal.registered" data-label="등록인감" data-type="seal"></span><div></div></div>
  </div>
  <div class="pb-r">
    <div class="right small muted">통장번호 <span class="fv" data-field="passbook_no" data-label="통장번호" data-type="number"></span></div>
    <table class="plain">
      <tbody><tr><td>계좌번호</td><td class="pb-acct"><span class="fv" data-field="account_no" data-label="계좌번호" data-type="text"></span></td></tr>
      <tr><td>고 객 명</td><td style="font-size:16px;font-weight:700"><span class="fv" data-field="holder" data-label="예금주" data-type="text"></span> 님</td></tr>
      <tr><td>신 규 일</td><td><span class="fv" data-field="opened" data-label="신규일" data-type="date"></span></td></tr>
      <tr><td>취 급 점</td><td><span class="fv" data-field="branch" data-label="지점명" data-type="text"></span></td></tr>
      <tr><td>전화번호</td><td><span class="fv" data-field="branch_phone" data-label="지점전화번호" data-type="text"></span></td></tr>
    </tbody></table>
    <table class="pbt">
      <tbody><tr><th>거래일</th><th>적요</th><th>찾으신금액</th><th>맡기신금액</th><th>잔액</th></tr>
      <tr><td class="c"><span class="fv" data-field="first_tx.date" data-label="거래일" data-type="date"></span></td><td class="c"><span class="fv" data-field="first_tx.memo" data-label="적요" data-type="text"></span></td><td class="num"></td>
          <td class="num"><span class="fv" data-field="first_tx.amount" data-label="맡기신금액" data-type="amount"></span></td><td class="num"><span class="fv" data-field="first_tx.balance" data-label="잔액" data-type="amount"></span></td></tr>
      <tr><td class="c"><span class="fv" data-field="txs.0.date" data-label="거래일" data-type="date"></span></td><td class="c"><span class="fv" data-field="txs.0.memo" data-label="적요" data-type="text"></span></td>
          <td class="num"><span class="fv" data-field="txs.0.out" data-label="찾으신금액" data-type="number"></span></td>
          <td class="num"></td>
          <td class="num"><span class="fv" data-field="txs.0.balance" data-label="잔액" data-type="amount"></span></td></tr>
      <tr><td class="c"><span class="fv" data-field="txs.1.date" data-label="거래일" data-type="date"></span></td><td class="c"><span class="fv" data-field="txs.1.memo" data-label="적요" data-type="text"></span></td>
          <td class="num"><span class="fv" data-field="txs.1.out" data-label="찾으신금액" data-type="number"></span></td>
          <td class="num"></td>
          <td class="num"><span class="fv" data-field="txs.1.balance" data-label="잔액" data-type="amount"></span></td></tr>
<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr><tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>    </tbody></table>
    <div class="closed-stamp"><div class="t"><span class="fv" data-field="status" data-label="계좌상태" data-type="text"></span></div><div class="d"><span class="fv" data-field="closed_date" data-label="해지일" data-type="date"></span></div><div class="d">여의도지점</div></div>
  </div>
</div>
</div>

</body></html>
