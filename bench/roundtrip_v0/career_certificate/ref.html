<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>경력증명서</title>
<style>
:root {
  --font: &#39;Noto Sans CJK KR&#39;, &#39;Malgun Gothic&#39;, &#39;Nanum Gothic&#39;, &#39;NanumBarunGothic&#39;, &#39;Gulim&#39;, &#39;Dotum&#39;, sans-serif;
  --fs: 12.6px;
  --title: 25px;
  --lh: 1.52;
  --border: #333;
  --bw: 1px;
  --label-bg: #f7f3ea;
  --accent: #0b5394;
  --pad: 6px;
  --page-pad: 53px;
  --paper: #ffffff;
  --seal: #d11;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.page {
  position: relative; overflow: hidden; background: var(--paper); color: #111;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  width: 794px; height: 1123px; padding: var(--page-pad);
}
.page.a4_landscape { width: 1123px; height: 794px; }
.page.card { width: 540px; height: 340px; padding: 20px 24px; border-radius: 18px; }
.page.passport { width: 720px; height: 500px; padding: 22px 28px; }
.page.a4.dense { font-size: calc(var(--fs) - 1.5px); line-height: 1.35; }

h1.title { text-align: center; font-size: var(--title); letter-spacing: .25em; margin: 6px 0 22px; font-weight: 700; }
h1.title.box { border: 2px solid var(--border); padding: 8px; }
h1.title .sub { display: block; font-size: 13px; letter-spacing: .05em; font-weight: 400; color: #444; margin-top: 4px; }
h2.sec { font-size: calc(var(--fs) + 2px); margin: 16px 0 6px; padding-left: 8px; border-left: 4px solid var(--accent); }
h3.sec { font-size: calc(var(--fs) + 1px); margin: 12px 0 4px; }

table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th, td { border: var(--bw) solid var(--border); padding: var(--pad) calc(var(--pad) + 3px); vertical-align: middle; }
th { background: var(--label-bg); font-weight: 600; text-align: center; white-space: nowrap; }
td.num, .num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, .c { text-align: center; }
table.plain th, table.plain td { border: 0; padding: 2px 4px; background: none; text-align: left; }
table.outer { border: 2px solid var(--border); }
table.compact th, table.compact td { padding: 3px 5px; font-size: calc(var(--fs) - 1px); }

.row { display: flex; gap: 12px; align-items: flex-start; }
.between { display: flex; justify-content: space-between; align-items: flex-end; }
.right { text-align: right; } .center { text-align: center; } .bold { font-weight: 700; }
.small { font-size: calc(var(--fs) - 2px); } .tiny { font-size: calc(var(--fs) - 3.5px); }
.muted { color: #555; } .accent { color: var(--accent); }
.box { border: var(--bw) solid var(--border); padding: 10px 12px; margin: 8px 0; }
.note { font-size: calc(var(--fs) - 2px); color: #333; margin: 6px 0; }
.note li { margin: 2px 0; }
.mt { margin-top: 18px; } .mb { margin-bottom: 18px; } .mt-l { margin-top: 36px; }
.spacer { flex: 1; }
.u { border-bottom: 1px solid #333; padding: 0 6px; }
ol.clauses { padding-left: 1.4em; margin: 6px 0; }
ol.clauses li { margin: 3px 0; }

.issuer { text-align: center; margin-top: 28px; }
.issuer .date { margin-bottom: 18px; letter-spacing: .05em; }
.issuer .org { font-size: calc(var(--fs) + 8px); font-weight: 700; letter-spacing: .2em; position: relative; display: inline-block; padding-right: 18px; }
.seal {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  width: 64px; height: 64px; border: 3px solid var(--seal); color: var(--seal);
  border-radius: 50%; font-size: 13px; line-height: 1.1; font-weight: 700;
  transform: rotate(-7deg); opacity: .82; vertical-align: middle; letter-spacing: 0;
  font-family: 'Nanum Myeongjo', 'Noto Serif CJK KR', serif; word-break: keep-all;
}
.seal.square { border-radius: 4px; }
.seal.img { border: none; } .seal.img img { width: 100%; height: 100%; object-fit: contain; }
.seal.sm { width: 40px; height: 40px; font-size: 10px; border-width: 2px; }
.seal.lg { width: 84px; height: 84px; font-size: 15px; }
.seal.over { position: absolute; right: -40px; top: -18px; }
.signline { display: inline-block; min-width: 120px; }
.inmark { position: relative; display: inline-block; min-width: 34px; text-align: center; }
.inmark .seal.onmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); margin: 0; }
.inmark .scribble { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); pointer-events: none; }
.corr { white-space: normal; }
.corr-old, .corr .fv { white-space: nowrap; }
.corr-old { text-decoration: line-through double; text-decoration-color: #c00; color: inherit; }
.seal.corr-seal { width: 22px; height: 22px; font-size: 7px; border-width: 1.5px; margin-left: 2px; vertical-align: -4px; }
.seal-missing { display: inline-block; width: 64px; height: 64px; vertical-align: middle; }
.seal-missing.sm { width: 40px; height: 40px; } .seal-missing.lg { width: 84px; height: 84px; }
.pg-keep { break-inside: avoid; }
.scribble svg { display: block; overflow: visible; }
.chk { white-space: nowrap; margin-right: 10px; }
.photo {
  background: linear-gradient(#e8e8e8, #d0d0d0); border: 1px solid #aaa; position: relative; overflow: hidden;
}
.photo::after {
  content: ""; position: absolute; left: 50%; top: 22%; width: 42%; height: 36%; transform: translateX(-50%);
  background: #b8b8b8; border-radius: 50%; box-shadow: 0 60px 0 30px #b8b8b8;
}
.sample-mark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-24deg);
  font-size: 64px; font-weight: 900; color: rgba(220, 20, 20, .16); letter-spacing: .2em;
  white-space: nowrap; pointer-events: none; font-family: sans-serif; z-index: 10;
}
.page.card .sample-mark { font-size: 44px; }
.docno { font-size: calc(var(--fs) - 2px); color: #333; }
.gov-head { display: flex; justify-content: space-between; font-size: calc(var(--fs) - 2px); color: #333; margin-bottom: 6px; }
.keep { display: flex; flex-direction: column; } /* 맺음말·발급기관·직인은 한 덩어리 (쪽 나눔에서 쪼개지 않음) */
table.career td { font-size: calc(var(--fs) - 0.5px); }
.cert-text { font-size: calc(var(--fs) + 2px); letter-spacing: .03em; }
</style>
</head>
<body>
<div class="page a4">
<div class="docno pg-repeat">문서번호 : <span class="fv" data-field="doc_no" data-label="문서번호" data-type="text"></span></div>
<h1 class="title">경 력 증 명 서</h1>
<h2 class="sec">인적사항</h2>
<table class="kv ">
<colgroup><col style="width:110px"><col><col style="width:110px"><col></colgroup><tbody><tr>
<th data-label="person.name">성　　명</th><td><span class="fv" data-field="person.name" data-label="성명" data-type="text"></span></td>
<th data-label="person.rrn">주민등록번호</th><td><span class="fv" data-field="person.rrn" data-label="주민등록번호" data-type="text"></span></td>
</tr>
<tr>
<th data-label="person.address">주　　소</th><td colspan="3"><span class="fv" data-field="person.address" data-label="주소" data-type="text"></span></td>
</tr>
<tr>
<th data-label="person.phone">연 락 처</th><td><span class="fv" data-field="person.phone" data-label="연락처" data-type="text"></span></td>
<th data-label="hire_date">입 사 일</th><td><span class="fv" data-field="hire_date" data-label="입사일" data-type="date"></span></td>
</tr>
</tbody></table>
<h2 class="sec">경력사항</h2>
<table class="career">
  <colgroup><col style="width:34%"><col style="width:17%"><col style="width:12%"><col></colgroup>
  <tbody><tr><th>근 무 기 간</th><th>근무부서</th><th>직　위</th><th>담 당 업 무</th></tr>
  <tr>
    <td class="c"><span class="fv" data-field="careers.0.period" data-label="근무기간" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.0.department" data-label="근무부서" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.0.position" data-label="직위" data-type="text"></span></td>
    <td><span class="fv" data-field="careers.0.duty" data-label="담당업무" data-type="text"></span></td>
  </tr>
  <tr>
    <td class="c"><span class="fv" data-field="careers.1.period" data-label="근무기간" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.1.department" data-label="근무부서" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.1.position" data-label="직위" data-type="text"></span></td>
    <td><span class="fv" data-field="careers.1.duty" data-label="담당업무" data-type="text"></span></td>
  </tr>
  <tr>
    <td class="c"><span class="fv" data-field="careers.2.period" data-label="근무기간" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.2.department" data-label="근무부서" data-type="text"></span></td>
    <td class="c"><span class="fv" data-field="careers.2.position" data-label="직위" data-type="text"></span></td>
    <td><span class="fv" data-field="careers.2.duty" data-label="담당업무" data-type="text"></span></td>
  </tr>
<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>  <tr><th>총 근무기간</th><td colspan="3" class="c bold"><span class="fv" data-field="total_period" data-label="총근무기간" data-type="text"></span></td></tr>
</tbody></table>
<table class="kv">
  <colgroup><col style="width:110px"><col><col style="width:110px"><col style="width:30%"></colgroup>
  <tbody><tr><th>용　　도</th><td><span class="fv" data-field="purpose" data-label="용도" data-type="text"></span></td><th style="width:110px">제 출 처</th><td><span class="fv" data-field="submit_to" data-label="제출처" data-type="text"></span></td></tr>
</tbody></table>
<div class="keep">
<p class="center mt-l cert-text">위의 기재사항이 사실과 다름없음을 증명합니다.</p>
<div class="issuer">
  <div class="date"><span class="fv" data-field="issue_date" data-label="발급일" data-type="date"></span></div>
  <table class="plain" style="width:auto;margin:0 auto;font-size:calc(var(--fs) + 1px)">
    <tbody><tr><td>회 사 명 :</td><td class="bold"><span class="fv" data-field="company.name" data-label="회사명" data-type="text"></span></td></tr>
    <tr><td>사업자등록번호 :</td><td><span class="fv" data-field="company.biz_no" data-label="사업자등록번호" data-type="text"></span></td></tr>
    <tr><td>소 재 지 :</td><td><span class="fv" data-field="company.address" data-label="소재지" data-type="text"></span></td></tr>
    <tr><td>전화번호 :</td><td><span class="fv" data-field="company.phone" data-label="전화번호" data-type="text"></span></td></tr>
  </tbody></table>
  <div class="mt" style="position:relative;display:inline-block;padding-right:30px;font-size:calc(var(--fs) + 4px);font-weight:700;letter-spacing:.1em">대표이사&nbsp;&nbsp;<span class="fv" data-field="company.ceo" data-label="대표이사" data-type="text"></span><span data-field="seal.company" data-label="회사직인" data-type="seal"></span></div>
</div>
</div>
</div>

</body></html>
