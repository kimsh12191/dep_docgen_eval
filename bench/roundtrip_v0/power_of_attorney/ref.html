<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>위임장</title>
<style>
:root {
  --font: &#39;Malgun Gothic&#39;, &#39;Nanum Gothic&#39;, &#39;NanumBarunGothic&#39;, &#39;Noto Sans CJK KR&#39;, &#39;Gulim&#39;, &#39;Dotum&#39;, sans-serif;
  --fs: 13.4px;
  --title: 26px;
  --lh: 1.54;
  --border: #222;
  --bw: 1px;
  --label-bg: #eeeeee;
  --accent: #00573f;
  --pad: 4px;
  --page-pad: 58px;
  --paper: #ffffff;
  --seal: #d11;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.page {
  position: relative; overflow: hidden; background: var(--paper); color: #111;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  width: 794px; height: 1123px; padding: var(--page-pad);
}
.page.a4_landscape { width: 1123px; height: 794px; }
.page.card { width: 540px; height: 340px; padding: 20px 24px; border-radius: 18px; }
.page.passport { width: 720px; height: 500px; padding: 22px 28px; }
.page.a4.dense { font-size: calc(var(--fs) - 1.5px); line-height: 1.35; }

h1.title { text-align: center; font-size: var(--title); letter-spacing: .25em; margin: 6px 0 22px; font-weight: 700; }
h1.title.box { border: 2px solid var(--border); padding: 8px; }
h1.title .sub { display: block; font-size: 13px; letter-spacing: .05em; font-weight: 400; color: #444; margin-top: 4px; }
h2.sec { font-size: calc(var(--fs) + 2px); margin: 16px 0 6px; padding-left: 8px; border-left: 4px solid var(--accent); }
h3.sec { font-size: calc(var(--fs) + 1px); margin: 12px 0 4px; }

table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th, td { border: var(--bw) solid var(--border); padding: var(--pad) calc(var(--pad) + 3px); vertical-align: middle; }
th { background: var(--label-bg); font-weight: 600; text-align: center; white-space: nowrap; }
td.num, .num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, .c { text-align: center; }
table.plain th, table.plain td { border: 0; padding: 2px 4px; background: none; text-align: left; }
table.outer { border: 2px solid var(--border); }
table.compact th, table.compact td { padding: 3px 5px; font-size: calc(var(--fs) - 1px); }

.row { display: flex; gap: 12px; align-items: flex-start; }
.between { display: flex; justify-content: space-between; align-items: flex-end; }
.right { text-align: right; } .center { text-align: center; } .bold { font-weight: 700; }
.small { font-size: calc(var(--fs) - 2px); } .tiny { font-size: calc(var(--fs) - 3.5px); }
.muted { color: #555; } .accent { color: var(--accent); }
.box { border: var(--bw) solid var(--border); padding: 10px 12px; margin: 8px 0; }
.note { font-size: calc(var(--fs) - 2px); color: #333; margin: 6px 0; }
.note li { margin: 2px 0; }
.mt { margin-top: 18px; } .mb { margin-bottom: 18px; } .mt-l { margin-top: 36px; }
.spacer { flex: 1; }
.u { border-bottom: 1px solid #333; padding: 0 6px; }
ol.clauses { padding-left: 1.4em; margin: 6px 0; }
ol.clauses li { margin: 3px 0; }

.issuer { text-align: center; margin-top: 28px; }
.issuer .date { margin-bottom: 18px; letter-spacing: .05em; }
.issuer .org { font-size: calc(var(--fs) + 8px); font-weight: 700; letter-spacing: .2em; position: relative; display: inline-block; padding-right: 18px; }
.seal {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  width: 64px; height: 64px; border: 3px solid var(--seal); color: var(--seal);
  border-radius: 50%; font-size: 13px; line-height: 1.1; font-weight: 700;
  transform: rotate(-7deg); opacity: .82; vertical-align: middle; letter-spacing: 0;
  font-family: 'Nanum Myeongjo', 'Noto Serif CJK KR', serif; word-break: keep-all;
}
.seal.square { border-radius: 4px; }
.seal.img { border: none; } .seal.img img { width: 100%; height: 100%; object-fit: contain; }
.seal.sm { width: 40px; height: 40px; font-size: 10px; border-width: 2px; }
.seal.lg { width: 84px; height: 84px; font-size: 15px; }
.seal.over { position: absolute; right: -40px; top: -18px; }
.signline { display: inline-block; min-width: 120px; }
.inmark { position: relative; display: inline-block; min-width: 34px; text-align: center; }
.inmark .seal.onmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); margin: 0; }
.inmark .scribble { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); pointer-events: none; }
.corr { white-space: normal; }
.corr-old, .corr .fv { white-space: nowrap; }
.corr-old { text-decoration: line-through double; text-decoration-color: #c00; color: inherit; }
.seal.corr-seal { width: 22px; height: 22px; font-size: 7px; border-width: 1.5px; margin-left: 2px; vertical-align: -4px; }
.seal-missing { display: inline-block; width: 64px; height: 64px; vertical-align: middle; }
.seal-missing.sm { width: 40px; height: 40px; } .seal-missing.lg { width: 84px; height: 84px; }
.pg-keep { break-inside: avoid; }
.scribble svg { display: block; overflow: visible; }
.chk { white-space: nowrap; margin-right: 10px; }
.photo {
  background: linear-gradient(#e8e8e8, #d0d0d0); border: 1px solid #aaa; position: relative; overflow: hidden;
}
.photo::after {
  content: ""; position: absolute; left: 50%; top: 22%; width: 42%; height: 36%; transform: translateX(-50%);
  background: #b8b8b8; border-radius: 50%; box-shadow: 0 60px 0 30px #b8b8b8;
}
.sample-mark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-24deg);
  font-size: 64px; font-weight: 900; color: rgba(220, 20, 20, .16); letter-spacing: .2em;
  white-space: nowrap; pointer-events: none; font-family: sans-serif; z-index: 10;
}
.page.card .sample-mark { font-size: 44px; }
.docno { font-size: calc(var(--fs) - 2px); color: #333; }
.gov-head { display: flex; justify-content: space-between; font-size: calc(var(--fs) - 2px); color: #333; margin-bottom: 6px; }
h1.title { letter-spacing:.8em; margin:10px 0 22px; }
.sec { font-weight:700; margin:16px 0 4px; }
table.po th { width:120px; letter-spacing:.05em; }
.lead { margin:10px 0 6px; }
.tasks { border:var(--bw) solid var(--border); padding:10px 18px; line-height:1.9; }
.dt { text-align:center; margin:26px 0 16px; font-size:calc(var(--fs) + 1px); letter-spacing:.05em; }
.grantor-wrap { display:flex; align-items:center; gap:10px; }
.grantor-wrap table { flex:1; margin:0; }
.sealbox { width:118px; text-align:center; flex:none; }
.sealbox .lbl { font-size:calc(var(--fs) - 2px); color:#444; margin-bottom:4px; }
.to { margin-top:26px; font-size:calc(var(--fs) + 6px); font-weight:700; letter-spacing:.15em; }
.hand { font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif; color:#1c2c86; font-weight:700; display:inline-block; transform:rotate(-0.6deg); }
.att { margin-top:10px; font-size:calc(var(--fs) - 1.5px); color:#333; }
</style>
</head>
<body>
<div class="page a4">

<h1 class="title">위 임 장</h1>
<div class="sec">1. 대리인(수임인) 정보</div>
<table class="po">
  <tbody><tr><th>성　　명</th><td><span class="hand"><span class="fv" data-field="agent.name" data-label="성명" data-type="text"></span></span></td><th>생년월일</th><td><span class="hand"><span class="fv" data-field="agent.birth" data-label="생년월일" data-type="date"></span></span></td></tr>
  <tr><th>본인과의 관계</th><td><span class="hand"><span class="fv" data-field="agent.relation" data-label="본인과의관계" data-type="text"></span></span></td><th>연 락 처</th><td><span class="hand"><span class="fv" data-field="agent.phone" data-label="연락처" data-type="text"></span></span></td></tr>
  <tr><th>주　　소</th><td colspan="3"><span class="hand"><span class="fv" data-field="agent.address" data-label="주소" data-type="text"></span></span></td></tr>
</tbody></table>

<div class="sec">2. 위임내용</div>
<div class="lead">본인은 위 대리인에게 다음 사항에 관한 일체의 권한을 위임합니다.</div>
<div class="tasks">
<div><span class="fv" data-field="tasks.0" data-label="위임내용" data-type="text"></span></div><div><span class="fv" data-field="tasks.1" data-label="위임내용" data-type="text"></span></div><div class="mt">위임기간 : <span class="hand"><span class="fv" data-field="period" data-label="위임기간" data-type="text"></span></span></div>
</div>

<div class="dt"><span class="hand"><span class="corr"><s class="corr-old">2026년 01월 11일</s> <span class="fv" data-field="grant_date" data-label="작성일" data-type="date"></span><span class="seal sm corr-seal">박찬연</span></span></span></div>

<div class="sec">3. 위임인(본인) &nbsp;<span class="small" style="font-weight:400">위임인 구분 : <span data-field="grantor.type" data-label="위임인구분" data-type="checkbox" data-options="법인|개인"></span><span class="chk"><span class="cb">□</span> 법인</span><span class="chk"><span class="cb">□</span> 개인</span></span></div>
<div class="grantor-wrap">
<table class="po">
  <tbody><tr><th>상　　호</th><td><span class="fv" data-field="grantor.name" data-label="상호" data-type="text"></span></td><th>대 표 자</th><td>대표이사 <span class="fv" data-field="grantor.ceo" data-label="대표자" data-type="text"></span></td></tr>
  <tr><th>사업자등록번호</th><td><span class="fv" data-field="grantor.biz_no" data-label="사업자등록번호" data-type="text"></span></td><th>법인등록번호</th><td><span class="fv" data-field="grantor.corp_reg_no" data-label="법인등록번호" data-type="text"></span></td></tr>
  <tr><th>본점소재지</th><td colspan="3"><span class="hand"><span class="fv" data-field="grantor.address" data-label="본점소재지" data-type="text"></span></span></td></tr>
  <tr><th>연 락 처</th><td colspan="3"><span class="hand"><span class="corr"><s class="corr-old">92-9508-6789</s> <span class="fv" data-field="grantor.phone" data-label="연락처" data-type="text"></span><span class="seal sm corr-seal">박찬연</span></span></span></td></tr>
</tbody></table>
<div class="sealbox">
  <div class="lbl">(법인인감)</div><span data-field="seal.corp" data-label="법인인감" data-type="seal"></span><svg class="cseal" width="92" height="92" viewBox="0 0 120 120" style="display:inline-block;vertical-align:middle;opacity:.84;transform:rotate(-8deg);overflow:visible">
  <defs><path id="csp-poa" d="M 60,60 m -42,0 a 42,42 0 1,1 84,0 a 42,42 0 1,1 -84,0"></path></defs>
  <circle cx="60" cy="60" r="57" style="fill:none;stroke:var(--seal);stroke-width:3.6"></circle>
  <circle cx="60" cy="60" r="30" style="fill:none;stroke:var(--seal);stroke-width:2"></circle>
  <text style="fill:var(--seal);font-size:15px;font-weight:700;font-family:'Nanum Myeongjo','Noto Serif CJK KR',serif">
    <textPath href="#csp-poa" textLength="250" lengthAdjust="spacing">주식회사 유니온무역</textPath></text>
  <text x="60" y="56.5" text-anchor="middle" style="fill:var(--seal);font-size:16px;font-weight:700;font-family:'Nanum Myeongjo','Noto Serif CJK KR',serif">대표</text>
  <text x="60" y="73.5" text-anchor="middle" style="fill:var(--seal);font-size:14px;font-weight:700;font-family:'Nanum Myeongjo','Noto Serif CJK KR',serif">이사인</text>
</svg>
</div>
</div>
<div class="att">※ 위임인은 법인인감을 날인하고 법인인감증명서(최근 3개월 이내 발급분)를 첨부하여야 합니다.<br>※ 첨부 : <span class="fv" data-field="attachment" data-label="첨부서류" data-type="text"></span>, 대리인 신분증 사본 1부</div>
<div class="to"><span class="fv" data-field="recipient" data-label="제출처" data-type="text"></span></div>
</div>

</body></html>
