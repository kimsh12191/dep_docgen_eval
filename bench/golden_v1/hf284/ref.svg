<text x="58.6" y="250.9" font-size="18.7" font-family="Malgun Gothic">KEB하나은행 앞</text>
<text x="58.6" y="322.4" font-size="14.7" font-family="Malgun Gothic">년       월       일자로 귀행으로부터 발급받은 인감증( 번호 :          )을 아래와 같은 사유로 분실하였음을</text>
<text x="58.6" y="349.0" font-size="14.7" font-family="Malgun Gothic">신고하니 이미 제출된 본인의 인감(서명감)신고서에 의거 인감증을 재발급하여 주시기 바라며, 이로 말미암아</text>
<text x="58.6" y="375.7" font-size="14.7" font-family="Malgun Gothic">생기는 비용 및 손해는 모두 본인이 부담하겠습니다.</text>
<text x="66.6" y="455.5" font-size="14.7" font-family="Malgun Gothic">분실 사유 :</text>
<text x="342.0" y="649.2" font-size="14.7" font-family="Malgun Gothic">년        월        일</text>
<text x="104.0" y="756.0" font-size="14.7" font-family="Malgun Gothic">본    인                                                            (인)</text>
<text x="103.9" y="802.6" font-size="14.7" font-family="Malgun Gothic">주    소</text>
<text x="89.3" y="927.7" font-size="14.7" font-family="Malgun Gothic">은     행</text>
<text x="89.3" y="962.9" font-size="14.7" font-family="Malgun Gothic">사 용 란</text>
<text x="266.8" y="911.3" font-size="14.7" font-family="Malgun Gothic">처리 내역</text>
<text x="452.4" y="911.3" font-size="14.7" font-family="Malgun Gothic">처 리 일 자</text>
<text x="633.5" y="911.3" font-size="14.7" font-family="Malgun Gothic">확    인</text>
<text x="244.8" y="945.3" font-size="14.7" font-family="Malgun Gothic">각 영업점앞 통보</text>
<text x="266.8" y="979.3" font-size="14.7" font-family="Malgun Gothic">재  발  급</text>
<text x="212.9" y="142.7" font-size="26.7" font-family="Malgun Gothic">인감증 분실신고 및 재발급 신청서</text>
<text x="58.6" y="1087.8" font-size="8.0" font-family="Malgun Gothic">5-09-0331(1-1) (2016.06 제정)</text>
<text x="58.6" y="1097.8" font-size="8.0" font-family="Malgun Gothic">(보존년한 : 10년)</text>
