<text x="277.6" y="134.0" font-size="23.3" font-family="Malgun Gothic">전자채권 사고신고(취하)서</text>
<text x="59.4" y="194.4" font-size="15.5" font-family="Malgun Gothic">주식회사 하나은행                                   지점 앞</text>
<text x="59.4" y="234.4" font-size="12.9" font-family="Malgun Gothic">다음과 같이 전자채권을 사고신고(취하) 하오니 처리하여 주시기 바랍니다.</text>
<text x="59.4" y="888.9" font-size="10.3" font-family="Malgun Gothic">주) 1. 사고신고서 접수는 구매기업요청에 의한 사고신고(계약불이행, 피사취, 합의불가), 법적으로 가해진 지급제한의 경우에만 가능</text>
<text x="74.2" y="906.3" font-size="10.3" font-family="Malgun Gothic">2. 구매기업 요청에 의한 사고신고는 이미 전자채권담보대출이 실행된 경우에는 사고신고 접수 불가</text>
<text x="74.2" y="923.6" font-size="10.3" font-family="Malgun Gothic">3. 구매기업 요청에 의한 사고신고 및 법적으로 가해진 지급제한 중 지급정지가처분명령에 의한 경우에는 반드시 사고신고담보금을 입금하고 「전자채권 사고신고 담보금</text>
<text x="84.2" y="940.9" font-size="10.3" font-family="Malgun Gothic">처리를 위한 약정서」를 작성하여야 함</text>
<text x="58.0" y="1089.1" font-size="8.0" font-family="Malgun Gothic">5-06-0261(1-1) (2021.09 개정)</text>
<text x="58.0" y="1098.0" font-size="8.0" font-family="Malgun Gothic">(보존년한 : 완제일로부터 10년)</text>
<text x="97.4" y="280.0" font-size="11.4" font-family="Malgun Gothic">전자채권번호</text>
<text x="442.4" y="280.0" font-size="11.4" font-family="Malgun Gothic">금          액</text>
<text x="103.1" y="310.6" font-size="11.4" font-family="Malgun Gothic">발   행   일</text>
<text x="443.2" y="310.6" font-size="11.4" font-family="Malgun Gothic">만   기   일</text>
<text x="91.5" y="341.3" font-size="11.4" font-family="Malgun Gothic">판매기업 기업명</text>
<text x="422.4" y="341.3" font-size="11.4" font-family="Malgun Gothic">판매기업 사업자번호</text>
<text x="91.5" y="371.9" font-size="11.4" font-family="Malgun Gothic">담보금 입금유무</text>
<text x="436.2" y="371.9" font-size="11.4" font-family="Malgun Gothic">사고신고 구분</text>
<text x="589.0" y="372.3" font-size="12.7" font-family="Malgun Gothic">□신고           □취하</text>
<text x="94.3" y="424.1" font-size="11.4" font-family="Malgun Gothic">사고신고(취하)</text>
<text x="94.2" y="441.5" font-size="11.4" font-family="Malgun Gothic">사                유</text>
<text x="327.0" y="539.0" font-size="13.3" font-family="Malgun Gothic">20          년         월         일</text>
