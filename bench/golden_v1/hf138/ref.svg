<text x="279.9" y="135.2" font-size="26.7" font-family="Malgun Gothic">대출금 수령위임동의서</text>
<text x="58.6" y="199.9" font-size="13.3" font-family="Malgun Gothic">(주)하나은행 귀하</text>
<text x="58.6" y="239.9" font-size="13.3" font-family="Malgun Gothic">차주</text>
<text x="204.3" y="239.9" font-size="13.3" font-family="Malgun Gothic">이 귀행으로부터 수령할 대출금 중 아래의 금액을 대출금 수령 위임계좌로 입금하여 주시기 바랍니다.</text>
<text x="141.8" y="319.2" font-size="13.3" font-family="Malgun Gothic">용도</text>
<text x="130.2" y="375.9" font-size="13.3" font-family="Malgun Gothic">수령금액</text>
<text x="257.6" y="375.9" font-size="13.3" font-family="Malgun Gothic">금</text>
<text x="434.8" y="375.9" font-size="13.3" font-family="Malgun Gothic">원정 (\</text>
<text x="632.3" y="375.9" font-size="13.3" font-family="Malgun Gothic">)</text>
<text x="118.6" y="432.6" font-size="13.3" font-family="Malgun Gothic">수령위임계좌</text>
<text x="257.6" y="422.6" font-size="13.3" font-family="Malgun Gothic">은행명 :</text>
<text x="257.6" y="442.6" font-size="13.3" font-family="Malgun Gothic">계좌번호 :</text>
<text x="136.0" y="489.3" font-size="13.3" font-family="Malgun Gothic">예금주</text>
<text x="116.8" y="574.4" font-size="13.3" font-family="Malgun Gothic">차주와의 관계</text>
<text x="257.6" y="534.4" font-size="13.3" font-family="Malgun Gothic">□부동산담보대출의 경우 매도인</text>
<text x="257.6" y="554.4" font-size="13.3" font-family="Malgun Gothic">□전세자금대출의 경우 임대인</text>
<text x="257.6" y="574.4" font-size="13.3" font-family="Malgun Gothic">□차주를 대신하여 당타행 대출의 상환을 위임받은 자</text>
<text x="257.6" y="594.4" font-size="13.3" font-family="Malgun Gothic">□공사대금 수령업체</text>
<text x="257.6" y="614.4" font-size="13.3" font-family="Malgun Gothic">□상기 외 제3자 (관계기재) :</text>
<text x="343.4" y="682.0" font-size="13.3" font-family="Malgun Gothic">년</text>
<text x="387.4" y="682.0" font-size="13.3" font-family="Malgun Gothic">월</text>
<text x="435.0" y="682.0" font-size="13.3" font-family="Malgun Gothic">일</text>
<text x="440.7" y="735.4" font-size="13.3" font-family="Malgun Gothic">수령위임인 :                                        (서명 또는 날인)</text>
<text x="390.7" y="762.1" font-size="13.3" font-family="Malgun Gothic">수령위임인의 대리인 :                                        (서명 또는 날인)</text>
<text x="422.2" y="788.8" font-size="13.3" font-family="Malgun Gothic">(대리인이 작성시에는 수령위임인으로부터 위임장 필수징구)</text>
<text x="58.6" y="875.5" font-size="13.3" font-family="Malgun Gothic">*작성대상 : ① 수령위임계좌의 예금주가 법인/개인사업자인 경우(계좌관리가 직원 등 타인에 의해 이루어질 수 있는 경우) 중</text>
<text x="133.8" y="895.5" font-size="13.3" font-family="Malgun Gothic">대체로 실행하여 수령위임계좌로 입금하는 경우 (차주 통장에 입금 후 출금은 작성대상 아님)</text>
<text x="121.0" y="915.5" font-size="13.3" font-family="Malgun Gothic">②수령위임계좌의 예금주가 공사(LH공사, SH공사 등), 지방자치단체, 국가인 경우 작성대상 아님</text>
<text x="121.0" y="935.5" font-size="13.3" font-family="Malgun Gothic">③중도금대출 등 협약에 의하여 입금내용이 고지가 된 건은 작성대상 아님</text>
<text x="56.8" y="1091.2" font-size="7.6" font-family="Malgun Gothic">5-06-0741(1-1)(2015. 09. 01개정)</text>
<text x="56.8" y="1100.8" font-size="7.6" font-family="Malgun Gothic">(보존년한 : 완제일로부터 5년)</text>
