<text x="56.7" y="1091.6" font-size="8.0" font-family="Malgun Gothic">7-99-0062(1-1) (2024.11 제정)</text>
<text x="56.7" y="1101.6" font-size="8.0" font-family="Malgun Gothic">(보존년한 : 해지일로부터 1년)</text>
<text x="197.2" y="157.0" font-size="29.3" font-family="Malgun Gothic">[필수] 개인정보 수집 · 이용 동의서</text>
<text x="236.9" y="189.1" font-size="21.3" font-family="Malgun Gothic">[아이부자 앱 걷기 챌린지 서비스 이용]</text>
<text x="58.8" y="268.9" font-size="13.3" font-family="Malgun Gothic">(주)하나은행 귀중</text>
<text x="58.8" y="292.6" font-size="13.3" font-family="Malgun Gothic">* 귀 행이 아이부자 앱에서 제공중인 걷기 챌린지 서비스 이용을 위하여 본인의 개인정보를 수집·이용하고자 하는 경우에는 「개인정</text>
<text x="58.8" y="312.6" font-size="13.3" font-family="Malgun Gothic">보보호법」등 관계 법령에 따라 본인의 동의가 필요합니다.</text>
<text x="85.9" y="362.0" font-size="14.5" font-family="Malgun Gothic">수집 · 이용 목적</text>
<text x="212.7" y="361.6" font-size="13.1" font-family="Malgun Gothic">- 아이부자 앱 걷기 챌린지 서비스 목표달성 여부 확인</text>
<text x="83.4" y="423.8" font-size="14.5" font-family="Malgun Gothic">보유 및 이용기간</text>
<text x="212.7" y="399.2" font-size="15.8" font-family="Malgun Gothic">- 아이부자앱 탈회 후 1년까지 보유 · 이용</text>
<text x="220.3" y="432.9" font-size="13.1" font-family="Malgun Gothic">탈회 후에는 금융사고 조사, 분쟁 해결, 민원 처리, 법령상 의무이행을 위한 목적으로만 보유·이용됩</text>
<text x="220.3" y="451.6" font-size="13.1" font-family="Malgun Gothic">니다.</text>
<text x="75.1" y="505.5" font-size="14.5" font-family="Malgun Gothic">거부 권리 및 불이익</text>
<text x="212.7" y="485.1" font-size="13.1" font-family="Malgun Gothic">귀하는 동의를 거부하실 수 있습니다. 다만, 위 개인정보 수집·이용에 관한 동의는 “아이부자 앱 걷기</text>
<text x="212.7" y="505.1" font-size="13.1" font-family="Malgun Gothic">챌린지 서비스 이용”을 위한 필수적 사항이므로, 위 사항에 동의하셔야만 걷기 챌린지 서비스 이용이</text>
<text x="212.7" y="525.1" font-size="13.1" font-family="Malgun Gothic">가능합니다.</text>
<text x="63.2" y="582.8" font-size="17.0" font-family="Malgun Gothic">수집 · 이용 항목</text>
<text x="68.9" y="617.1" font-size="14.5" font-family="Malgun Gothic">■개인(신용)정보</text>
<text x="68.9" y="644.9" font-size="13.1" font-family="Malgun Gothic">■일반개인정보</text>
<text x="212.7" y="644.9" font-size="13.1" font-family="Malgun Gothic">걸음 정보(걸음 수)</text>
<text x="212.7" y="681.2" font-size="13.1" font-family="Malgun Gothic">위 개인정보 수집·이용에 동의하십니까?                                            □ 동의하지 않음   □ 동의함</text>
<text x="523.9" y="764.7" font-size="13.3" font-family="Malgun Gothic">본인 성명 :                                  (서명)</text>
<text x="319.1" y="804.3" font-size="13.3" font-family="Malgun Gothic">년           월           일                      대리인 성명 :                                  (서명)</text>
