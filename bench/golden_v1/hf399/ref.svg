<text x="124.1" y="116.3" font-size="26.7" font-family="Malgun Gothic">파생상품거래 손실한도 초과 및 증거담보 요청 통지서</text>
<text x="335.1" y="143.5" font-size="18.7" font-family="Malgun Gothic">(파생상품거래용)</text>
<text x="58.6" y="193.3" font-size="15.8" font-family="Malgun Gothic">[수신] 대표이사 :</text>
<text x="58.6" y="218.2" font-size="15.8" font-family="Malgun Gothic">상      호 :</text>
<text x="58.6" y="243.1" font-size="15.8" font-family="Malgun Gothic">주      소 :</text>
<text x="58.6" y="268.0" font-size="15.8" font-family="Malgun Gothic">참      조 :                 [담당자 성명 기재]</text>
<text x="58.6" y="346.6" font-size="13.7" font-family="Malgun Gothic">[                               ] (이하”고객”이라 한다)은 주식회사 하나은행 (이하 “은행”이라 한다)과           년         월         일에</text>
<text x="58.6" y="365.3" font-size="13.7" font-family="Malgun Gothic">체결한 ‘파생상품거래 손실한도 약정서’ 및 이후 해당 약정서에서 정한 절차에 따라 체결한‘파생상품 거래 손실한도 변경약정서’</text>
<text x="58.6" y="384.0" font-size="13.7" font-family="Malgun Gothic">또는 은행이 고객에게 통지한 ‘파생상품거래 손실한도 감액통지서’에 따라 결정된‘파생상품거래 손실한도’를 다음과 같이 초과</text>
<text x="58.6" y="402.7" font-size="13.7" font-family="Malgun Gothic">하여 증거담보의 제공을 요청합니다.</text>
<text x="363.4" y="457.4" font-size="13.7" font-family="Malgun Gothic">[ 통지 내역 ]</text>
<text x="58.6" y="738.9" font-size="13.7" font-family="Malgun Gothic">※ 파생상품거래 손실 및 기 제공 증거담보 평가액의 상세내역은 첨부한 자료를 참조하여 주시기 바랍니다.</text>
<text x="58.6" y="797.0" font-size="13.7" font-family="Malgun Gothic">고객은 상기 증거담보 요청금액을 본 통지서의 수령일로부터 5영업일 이내에 당행에 제공하여 주시기 바랍니다.</text>
<text x="335.9" y="874.5" font-size="13.7" font-family="Malgun Gothic">년           월           일</text>
<text x="238.7" y="932.6" font-size="13.7" font-family="Malgun Gothic">주 소 :</text>
<text x="238.7" y="971.3" font-size="13.7" font-family="Malgun Gothic">상 호 : 주식회사 하나은행</text>
<text x="537.5" y="971.3" font-size="13.7" font-family="Malgun Gothic">(인)</text>
<text x="212.3" y="508.4" font-size="13.7" font-family="Malgun Gothic">파생상품거래 손실</text>
<text x="310.6" y="501.9" font-size="8.0" font-family="Malgun Gothic">※</text>
<text x="545.8" y="508.4" font-size="13.7" font-family="Malgun Gothic">원</text>
<text x="212.3" y="553.1" font-size="13.7" font-family="Malgun Gothic">파생상품거래 손실한도</text>
<text x="545.8" y="553.1" font-size="13.7" font-family="Malgun Gothic">원</text>
<text x="212.3" y="597.8" font-size="13.7" font-family="Malgun Gothic">파생상품거래 손실한도 초과금액</text>
<text x="612.5" y="597.8" font-size="13.7" font-family="Malgun Gothic">원</text>
<text x="212.3" y="642.5" font-size="13.7" font-family="Malgun Gothic">기 제공 증거담보 평가액</text>
<text x="342.5" y="636.0" font-size="8.0" font-family="Malgun Gothic">※</text>
<text x="545.8" y="642.5" font-size="13.7" font-family="Malgun Gothic">원</text>
<text x="212.3" y="687.3" font-size="13.7" font-family="Malgun Gothic">증거담보 요청금액</text>
<text x="309.5" y="680.7" font-size="8.0" font-family="Malgun Gothic">※</text>
<text x="545.8" y="687.3" font-size="13.7" font-family="Malgun Gothic">원</text>
<text x="56.7" y="1091.3" font-size="7.6" font-family="Malgun Gothic">5-09-0094(1-1) (2015. 09. 01. 개정)</text>
<text x="56.7" y="1100.6" font-size="7.6" font-family="Malgun Gothic">보존년한 : 완제일로부터 10년</text>
