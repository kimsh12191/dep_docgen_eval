const $=id=>document.getElementById(id), key='docgen-picks:'+manifest.source_commit+':'+manifest.name, names={keep:'채택',hold:'보류',drop:'제외',pending:'미검수'};
let saved={name:manifest.name,source_commit:manifest.source_commit,reviewer:'',items:{}}, current;
try{const s=JSON.parse(localStorage.getItem(key));if(s)saved=s}catch(e){}
$('reviewer').value=saved.reviewer||'';
function save(){saved.reviewer=$('reviewer').value;try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){$('message').textContent='브라우저 임시 저장을 사용할 수 없습니다. JSON으로 내려받으세요.'}}
function checks(){return Object.fromEntries([...document.querySelectorAll('[data-check]')].map(e=>[e.dataset.check,e.checked]))}
function changeNote(){if(!current)return;const old=saved.items[current.id]||{};saved.items[current.id]={...old,decision:old.decision||'pending',checks:checks(),note:$('note').value,image_sha256:current.image_sha256};save()}
function select(row){current=row;$('title').textContent=row.id+' · '+row.title;$('group').textContent=row.group;$('tier').textContent='제안 난이도 '+row.proposed_tier;$('reason').textContent=row.selection_reason+(row.complexity_tags?.length?' · '+row.complexity_tags.join(' / '):'');$('family').textContent='동일 출처 계열: '+row.family_members.join(', ');$('facts').textContent=`${row.width_pt} × ${row.height_pt} pt · PDF ${row.input_page_one_based}/${row.pdf_total_pages}쪽 · 서식 내 ${row.form_page_one_based||1}/${(row.declared_source_pages_zero_based||row.source_pages_zero_based).length}쪽 · 필드 참고 ${row.field_entries}개 · 분할 미지정`;$('source').href=manifest.source_repository+'/tree/'+manifest.source_commit+'/'+row.source_folder;$('image').src=row.id+'/image.png';const pick=saved.items[row.id]||{};$('note').value=pick.note||'';document.querySelectorAll('[data-check]').forEach(e=>e.checked=!!pick.checks?.[e.dataset.check]);$('message').textContent='현재 상태: '+names[pick.decision||'pending'];draw()}
function draw(){const counts={};for(const r of manifest.items){const d=saved.items[r.id]?.decision||'pending';counts[d]=(counts[d]||0)+1}$('count').textContent=Object.entries(counts).map(([k,v])=>names[k]+' '+v).join(' · ');$('list').replaceChildren();for(const r of manifest.items){if($('filter').value==='complex'?!r.complexity_tags?.length:($('filter').value!=='all'&&r.group!==$('filter').value))continue;const b=document.createElement('button');b.textContent=r.id+' · '+names[saved.items[r.id]?.decision||'pending'];b.classList.toggle('active',current?.id===r.id);b.onclick=()=>select(r);$('list').append(b)}}
document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{if(b.dataset.value==='keep'&&(!$('reviewer').value.trim()||!Object.values(checks()).every(Boolean))){$('message').textContent='채택하려면 검수자와 네 확인 항목을 입력하세요.';return}changeNote();saved.items[current.id].decision=b.dataset.value;saved.items[current.id].reviewed_at=new Date().toISOString();save();select(current)});
$('note').oninput=changeNote;document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{changeNote();if(saved.items[current.id]?.decision==='keep'&&!Object.values(checks()).every(Boolean)){saved.items[current.id].decision='pending';save();draw()}});$('reviewer').oninput=save;$('filter').onchange=draw;$('zoom').onclick=()=>$('imagebox').classList.toggle('zoom');
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forms-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(s.name!==manifest.name||s.source_commit!==manifest.source_commit||!s.items||typeof s.items!=='object')throw Error('다른 후보 세트입니다.');for(const [id,p] of Object.entries(s.items)){const r=manifest.items.find(x=>x.id===id);if(!r||p.image_sha256!==r.image_sha256||!names[p.decision])throw Error('문서 ID·해시·결정 상태가 맞지 않습니다.')}saved=s;$('reviewer').value=s.reviewer||'';save();select(current)}catch(err){$('message').textContent=err.message}};
const firstComplex=manifest.items.find(r=>r.complexity_tags?.length);if(firstComplex)$('filter').value='complex';select(firstComplex||manifest.items[0]);
