<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평가 서식 후보 · 최종 선정</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172738;font:15px/1.5 system-ui,sans-serif}header{background:#142b46;color:white;padding:22px 28px}h1{font-size:23px;margin:0}header p{margin:5px 0;color:#c4d7ec}main{display:grid;grid-template-columns:300px 1fr}aside{padding:18px;background:white;height:calc(100vh - 110px);overflow:auto;position:sticky;top:0}section{padding:24px;min-width:0}button,input,select,textarea{font:inherit;border:1px solid #bac8d8;border-radius:6px;padding:8px;background:white}button{cursor:pointer}button.active{border-color:#175bc2;background:#eaf2ff}.primary{background:#175bc2;color:white;border-color:#175bc2}aside button{display:block;width:100%;text-align:left;margin:6px 0;font-size:13px}.panel{padding:18px;border:1px solid #dbe2eb;border-radius:10px;background:white;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#61748a;font-size:13px}h2{font-size:20px;margin:0 0 9px}h3{font-size:15px;margin:0 0 8px}.image{height:75vh;overflow:auto;background:#e6edf5;padding:12px;text-align:center}.image img{max-width:100%;background:white}.image.zoom img{max-width:none}textarea{width:100%;min-height:90px}label{display:block;margin:8px 0}.checks label{font-size:14px}a{color:#175bc2}#message{color:#175bc2;white-space:pre-wrap}#list{margin-top:12px}.tag{background:#e8eef6;border-radius:20px;padding:3px 10px;font-size:12px}.pick{display:flex;gap:8px}.pick button[data-value=keep]{color:#106044}.pick button[data-value=drop]{color:#a12436}@media(max-width:800px){main{grid-template-columns:1fr}aside{height:220px;position:static}.image{height:60vh}section{padding:12px}}
</style>
<header><h1>평가 서식 후보 · 최종 선정</h1><p>gov · hana · hf / 원본 서식 선정 → 기준 HTML 생성 → 템플릿 검수 승인</p></header>
<main><aside><label>검수자 <input id="reviewer" placeholder="이름 또는 식별자"></label><select id="filter"><option value="all">전체</option><option value="gov">gov</option><option value="hana">hana</option><option value="hf">hf</option></select><p id="count" class="muted"></p><button class="primary" id="export">선정 결과 JSON 저장</button><label class="muted">이전 선정 결과 불러오기<input type="file" id="import" accept=".json"></label><div id="list"></div></aside>
<section><div class="panel"><h2 id="title"></h2><div class="toolbar"><span class="tag" id="group"></span><span class="tag" id="tier"></span><a id="source" target="_blank" rel="noreferrer">소스 서식 보기</a><button id="zoom">확대 / 맞춤</button></div><p id="reason"></p><p class="muted" id="family"></p><p class="muted" id="facts"></p><p class="muted">원본 PDF를 이미지로 변환했습니다. 값은 채우지 않았으며, 필드 메타데이터와 난이도는 검수 전 참고자료입니다.</p></div>
<div class="panel image" id="imagebox"><img id="image" alt="평가 후보 원본"></div>
<div class="panel"><h3>사람 확인</h3><div class="checks">
<label><input type="checkbox" data-check="legible"> 글자와 표가 읽히고 문서 전체가 포함되어 있습니다.</label>
<label><input type="checkbox" data-check="representative"> 실제 평가하려는 문서·구조를 대표합니다.</label>
<label><input type="checkbox" data-check="duplicates"> 중복·유사 서식과 기존 학습/개발 노출을 확인했습니다.</label>
<label><input type="checkbox" data-check="fields"> 반복 표와 고정 격자, 빈칸 등 기준 작성 시 확인할 부분을 살폈습니다.</label>
</div><textarea id="note" placeholder="선정/제외 사유, 난이도 수정 제안, 필드 누락, 유사 서식, 학습 노출 여부 등을 적으세요."></textarea><div class="pick"><button data-value="keep">채택</button><button data-value="hold">보류</button><button data-value="drop">제외</button></div><p id="message" role="status"></p><p class="muted">결정은 이 브라우저에 임시 저장됩니다. JSON 파일을 내려받아 보관하세요. 서식 채택은 기준 템플릿의 승인이 아닙니다.</p></div></section></main>
<script>
const manifest=__MANIFEST__;
const $=id=>document.getElementById(id), key='docgen-picks:'+manifest.source_commit+':'+manifest.name, names={keep:'채택',hold:'보류',drop:'제외',pending:'미검수'};
let saved={name:manifest.name,source_commit:manifest.source_commit,reviewer:'',items:{}}, current;
try{const s=JSON.parse(localStorage.getItem(key));if(s)saved=s}catch(e){}
$('reviewer').value=saved.reviewer||'';
function save(){saved.reviewer=$('reviewer').value;try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){$('message').textContent='브라우저 임시 저장을 사용할 수 없습니다. JSON으로 내려받으세요.'}}
function checks(){return Object.fromEntries([...document.querySelectorAll('[data-check]')].map(e=>[e.dataset.check,e.checked]))}
function changeNote(){if(!current)return;const old=saved.items[current.id]||{};saved.items[current.id]={...old,decision:old.decision||'pending',checks:checks(),note:$('note').value,image_sha256:current.image_sha256};save()}
function select(row){current=row;$('title').textContent=row.id+' · '+row.title;$('group').textContent=row.group;$('tier').textContent='제안 난이도 '+row.proposed_tier;$('reason').textContent=row.selection_reason;$('family').textContent='동일 출처 계열: '+row.family_members.join(', ');$('facts').textContent=`${row.width_pt} × ${row.height_pt} pt · 원본 ${row.input_page_one_based}/${row.pdf_total_pages}쪽 · 필드 참고 ${row.field_entries}개 · 분할 미지정`;$('source').href=manifest.source_repository+'/tree/'+manifest.source_commit+'/'+row.source_folder;$('image').src=row.id+'/image.png';const pick=saved.items[row.id]||{};$('note').value=pick.note||'';document.querySelectorAll('[data-check]').forEach(e=>e.checked=!!pick.checks?.[e.dataset.check]);$('message').textContent='현재 상태: '+names[pick.decision||'pending'];draw()}
function draw(){const counts={};for(const r of manifest.items){const d=saved.items[r.id]?.decision||'pending';counts[d]=(counts[d]||0)+1}$('count').textContent=Object.entries(counts).map(([k,v])=>names[k]+' '+v).join(' · ');$('list').replaceChildren();for(const r of manifest.items){if($('filter').value!=='all'&&r.group!==$('filter').value)continue;const b=document.createElement('button');b.textContent=r.id+' · '+names[saved.items[r.id]?.decision||'pending'];b.classList.toggle('active',current?.id===r.id);b.onclick=()=>select(r);$('list').append(b)}}
document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{if(b.dataset.value==='keep'&&(!$('reviewer').value.trim()||!Object.values(checks()).every(Boolean))){$('message').textContent='채택하려면 검수자와 네 확인 항목을 입력하세요.';return}changeNote();saved.items[current.id].decision=b.dataset.value;saved.items[current.id].reviewed_at=new Date().toISOString();save();select(current)});
$('note').oninput=changeNote;document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{changeNote();if(saved.items[current.id]?.decision==='keep'&&!Object.values(checks()).every(Boolean)){saved.items[current.id].decision='pending';save();draw()}});$('reviewer').oninput=save;$('filter').onchange=draw;$('zoom').onclick=()=>$('imagebox').classList.toggle('zoom');
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forms-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(s.name!==manifest.name||s.source_commit!==manifest.source_commit||!s.items||typeof s.items!=='object')throw Error('다른 후보 세트입니다.');for(const [id,p] of Object.entries(s.items)){const r=manifest.items.find(x=>x.id===id);if(!r||p.image_sha256!==r.image_sha256||!names[p.decision])throw Error('문서 ID·해시·결정 상태가 맞지 않습니다.')}saved=s;$('reviewer').value=s.reviewer||'';save();select(current)}catch(err){$('message').textContent=err.message}};
select(manifest.items[0]);
</script></html>
